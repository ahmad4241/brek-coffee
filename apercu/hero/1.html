@font-face{font-family:"Poppins";font-weight:400;src:url(../../fonts/poppins-regular.woff) format("woff")}
@font-face{font-family:"Poppins";font-weight:500;src:url(../../fonts/poppins-medium.woff) format("woff")}
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}body{font:400 16px/1.5 "Poppins",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wordmark path{stroke-linejoin:round;stroke-width:9.81;fill:currentColor;stroke:currentColor}
.tag{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:50;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;letter-spacing:.04em;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 16px}
.nav .wordmark{height:24px;width:auto}.burger{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.burger i{display:block;width:16px;height:1.6px;box-shadow:0 -3.2px 0 currentColor,0 3.2px 0 currentColor}
.go{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:360px;height:58px;padding:0 8px 0 24px;border-radius:99px;text-decoration:none;font-weight:500;font-size:16px}
.go i{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font-style:normal;font-size:18px}
@media (min-width:900px){.nav{padding:0 40px;height:76px}.nav .wordmark{height:28px}}

body{background:#0B0B0A;color:#F4F1EA}
.nav{color:#F4F1EA}.burger{background:#F4F1EA;color:#0B0B0A}
.hero{position:relative;height:100svh;min-height:640px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.light{position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,236,205,.22),rgba(255,236,205,.06) 45%,transparent 70%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.75}}
.cup{position:absolute;left:50%;top:41%;width:min(74vw,440px);transform:translate(-50%,-50%) scale(1.08);animation:in 2.4s cubic-bezier(.2,.8,.2,1) .2s both, drift 14s ease-in-out 2.6s infinite alternate;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))}
.cup img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 80%,transparent 97%);mask-image:linear-gradient(#000 80%,transparent 97%)}
@keyframes in{from{opacity:0;transform:translate(-50%,-44%) scale(1.22);filter:blur(12px) drop-shadow(0 40px 50px rgba(0,0,0,.6))}}
@keyframes drift{to{transform:translate(-50%,-51.5%) scale(1.12)}}
.steam{position:absolute;left:50%;top:13%;width:160px;height:200px;transform:translateX(-50%);pointer-events:none}
.steam span{position:absolute;bottom:0;width:26px;height:120px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);filter:blur(10px);animation:rise 5s ease-in infinite;opacity:0}
.steam span:nth-child(1){left:40px}.steam span:nth-child(2){left:72px;animation-delay:1.6s}.steam span:nth-child(3){left:100px;animation-delay:3.1s}
@keyframes rise{0%{transform:translateY(40px) scaleX(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-120px) scaleX(1.6) translateX(14px);opacity:0}}
.word{position:relative;z-index:2;color:#F4F1EA;margin:0 -6px 18px;animation:up 1.4s cubic-bezier(.2,.8,.2,1) 1.2s both}
.word .wordmark{width:100%;height:auto;display:block}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
.line{position:relative;z-index:2;display:flex;flex-direction:column;gap:16px;animation:up 1.2s cubic-bezier(.2,.8,.2,1) 1.8s both}
.line p{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#A9A49A}
.go{background:#F4F1EA;color:#0B0B0A}.go i{background:#0B0B0A;color:#F4F1EA}
@media (min-width:900px){.hero{padding:0 40px 40px}.cup{width:min(36vw,520px);top:40%}.line{flex-direction:row;align-items:center;justify-content:space-between}}
