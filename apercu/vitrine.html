@font-face{font-family:P;font-weight:400;src:url(../fonts/poppins-regular.woff)}
@font-face{font-family:P;font-weight:500;src:url(../fonts/poppins-medium.woff)}
@font-face{font-family:P;font-weight:700;src:url(../fonts/poppins-bold.woff)}
:root{--bg:#FAF8F3;--ink:#121212;--muted:#6B665D;--line:#E7E2D8;--accent:#5E7F1E;--amber:#F2A33A}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.55 P,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:relative;z-index:5}
.nav .wm{height:24px;width:auto;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:#fff}
.pill i{width:7px;height:7px;border-radius:50%;background:#B9B3A8}.pill.open i{background:#2E9B4F;box-shadow:0 0 0 3px #2E9B4F22}
.btns{display:flex;gap:10px}.b{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:99px;font-weight:500;font-size:15px;text-decoration:none;color:inherit;flex:1}
.bd{background:var(--ink);color:#fff}.bl{border:1.5px solid var(--ink)}
.kick{font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.switch{position:relative;white-space:nowrap;z-index:20;display:flex;width:max-content;margin:28px auto 24px;gap:6px;background:#121212;padding:6px;border-radius:99px}
.switch a{color:#fff;text-decoration:none;font-size:12px;padding:6px 11px;border-radius:99px}.switch a.on{background:#fff;color:#121212}
@media (min-width:900px){.wrap{max-width:1180px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero{position:relative;height:175svh}
.pin{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;overflow:hidden}
.nav{position:fixed;top:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px)}
.scene{position:relative;flex:none;overflow:hidden;margin:104px auto 0;aspect-ratio:400/640;width:min(100%,calc((100svh - 346px)*.625));transform-origin:62% 54%;will-change:transform}
.scene>svg,.back{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.back{transform:translate(calc(var(--px)*-7px),calc(var(--py)*-5px)) scale(1.04)}
.back svg{width:100%;height:100%}
.facade{transform:translate(calc(var(--px)*2px),calc(var(--py)*1.5px))}
.glassfx{transform:translate(calc(var(--px)*2px),calc(var(--py)*1.5px))}
.sheen{transform:translateX(calc(var(--px)*-40px));transition:transform .2s linear}
/* lighting */
.lit-only,.beam,.bulb{opacity:0;transition:opacity .8s ease}
.dark{opacity:.82;transition:opacity 1.2s ease}
.blocks{fill:#4a443c;transition:fill 1.2s ease}
.digits{opacity:0}
.on .lit-only{opacity:1}.on .dark{opacity:0}.on .blocks{fill:#FFF0CF}
.on .spot .bulb{animation:bulb .5s steps(1) var(--d) forwards}.on .spot .beam{animation:beam .9s ease var(--d) forwards}
@keyframes bulb{0%{opacity:1}20%{opacity:.2}40%,100%{opacity:1}}
@keyframes beam{from{opacity:0}to{opacity:.55}}
.on .digits{opacity:1}
.runner{transform:translate(170px,378px)}
.on .runner{animation:run 9s linear 1.8s infinite}
@keyframes run{0%{transform:translate(150px,376px)}40%,52%{transform:translate(228px,376px)}100%{transform:translate(420px,376px)}}
.sign{animation:swing 2.6s ease-in-out .4s 2}
@keyframes swing{30%{transform:rotate(7deg)}65%{transform:rotate(-5deg)}}
/* copy */
.copy{padding:16px 20px 18px;background:linear-gradient(to bottom,transparent,var(--bg) 22%)}
.copy h1{font-size:clamp(30px,8.4vw,54px);line-height:1.02;letter-spacing:-.04em;margin:0 0 8px}
.acc{color:var(--accent)}
.copy .lead{margin:0 0 14px;color:#3a362f;font-size:15px}
.next{min-height:70svh;padding:40px 20px;background:var(--bg)}
.next h2{font-size:48px;margin:0;letter-spacing:-.04em}
.switch{position:fixed;left:50%;transform:translateX(-50%);top:62px;bottom:auto;margin:0;opacity:.92;scale:.9}
@media (min-width:900px){
 .pin{flex-direction:row;align-items:center;justify-content:center;gap:56px;padding:70px 40px 20px}
 .scene{width:auto;height:calc(100svh - 110px);margin:0}
 .copy{max-width:420px;background:none}.copy h1{font-size:60px}}

<script>
var H={0:[10,18],1:null,2:[8,17],3:[8,17],4:[8,17],5:[8,17],6:[10,18]};

 return {d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),h:(+p.hour%24),m:+p.minute}}
function isOpen(){var q=new URLSearchParams(location.search).get('etat');if(q)return q==='ouvert';var g=gva(),t=H[g.d];return !!t&&g.h+g.m/60>=t[0]&&g.h+g.m/60<t[1]}
function nextOpen(){var g=gva();for(var k=0;k<8;k++){var d=(g.d+k)%7,t=H[d];if(t&&(k>0||g.h<t[0]))return (k===0?'à ':k===1?'demain à ':['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'][d]+' à ')+(t[0]<10?'0':'')+t[0]+':00'}}
var OPEN=isOpen(),g0=gva();
document.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('open',OPEN);p.lastChild.textContent=OPEN?'Ouvert · jusqu’à '+H[g0.d][1]+':00':'Fermé · ouvre '+nextOpen()});

var scene=document.getElementById('scene'),copy=document.getElementById('copy'),hero=document.getElementById('hero');
if(OPEN){setTimeout(function(){scene.classList.add('on')},300);document.querySelector('.sign-t').textContent='OUVERT';}
else{document.getElementById('lead').textContent='Fermé pour ce soir. On rallume la machine '+nextOpen()+'.';}
// depth: the inside moves a little against the frame
var tx=0,ty=0,cx=0,cy=0;
addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2},{passive:true});
var t0=performance.now();
(function loop(t){var auto=matchMedia('(hover:none)').matches;
 if(auto){tx=Math.sin((t-t0)/2600)*.8;ty=Math.cos((t-t0)/3400)*.4}
 cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;scene.style.setProperty('--px',cx.toFixed(3));scene.style.setProperty('--py',cy.toFixed(3));
 requestAnimationFrame(loop)})(t0);
// walk in: scrolling pushes the camera through the glass
function onScroll(){var r=hero.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(hero.offsetHeight-innerHeight)));
 var e=p*p*(3-2*p);scene.style.transform='scale('+(1+e*2.6)+')';scene.style.opacity=(1-Math.max(0,(p-.75)/.25)).toFixed(3);
 copy.style.opacity=(1-Math.min(1,p*2.2)).toFixed(3);}
addEventListener('scroll',onScroll,{passive:true});onScroll();
document.getElementById('enter').addEventListener('click',function(e){e.preventDefault();
 window.scrollTo({top:hero.offsetTop+hero.offsetHeight-innerHeight+2,behavior:'smooth'});});

</script></body></html>
