<script>
var H={0:[10,18],1:null,2:[8,17],3:[8,17],4:[8,17],5:[8,17],6:[10,18]};
function gva(){var p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Zurich',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
 return {d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),h:(+p.hour%24),m:+p.minute}}
function isOpen(){var q=new URLSearchParams(location.search).get('etat');if(q)return q==='ouvert';var g=gva(),t=H[g.d];return !!t&&g.h+g.m/60>=t[0]&&g.h+g.m/60<t[1]}
function nextOpen(){var g=gva();for(var k=0;k<8;k++){var d=(g.d+k)%7,t=H[d];if(t&&(k>0||g.h<t[0]))return (k===0?'à ':k===1?'demain à ':['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'][d]+' à ')+(t[0]<10?'0':'')+t[0]+':00'}}
var OPEN=isOpen(),g0=gva();
document.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('open',OPEN);p.lastChild.textContent=OPEN?'Ouvert · jusqu’à '+H[g0.d][1]+':00':'Fermé · ouvre '+nextOpen()});

var hero=document.querySelector('.hero'),st=document.getElementById('st');
if(!OPEN){hero.classList.add('closed');st.textContent='Fermé · ouvre '+nextOpen();document.getElementById('lead').textContent='On rallume la machine '+nextOpen()+'. Commandez déjà pour demain.';}
else{st.textContent='Ouvert · jusqu’à '+H[g0.d][1]+':00';}
var shot=document.getElementById('shot'),tx=0,cx=0,t0=performance.now();
addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*2},{passive:true});
(function l(t){if(matchMedia('(hover:none)').matches)tx=Math.sin((t-t0)/3000)*.6;cx+=(tx-cx)*.05;shot.style.setProperty('--px',cx.toFixed(3));
 document.querySelector('.sheen').style.translate=(cx*-60)+'px 0';requestAnimationFrame(l)})(t0);
